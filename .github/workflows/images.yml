name: Images

# ldk-server and ldk-server-mcp, for amd64 and arm64, each built on a native runner (a Rust
# build under QEMU emulation takes hours), then joined into one multi-arch image per name.
#
# They are published under the upstream version they run, not this repository's: the commit in
# docker/ldk-server/Dockerfile decides it (see docker/ldk-server/upstream-version.sh), e.g.
# 0.1.0-dbe22c5, or 0.2.0 plus 0.2 once that commit is an upstream release. A version tag is
# never rebuilt: a bundle release that keeps the same commit reuses the published images.
#
# Pushes to ghcr.io only for a v* tag of this repository; pull requests and manual runs just
# prove it builds.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["docker/**", ".github/workflows/images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  upstream:
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.version.outputs.revision }}
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      # Build and push new images: a release tag of this repository whose upstream version is
      # not published yet.
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: docker/ldk-server/upstream-version.sh | tee -a "$GITHUB_OUTPUT"
      - id: publish
        run: |
          publish=false
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = true ]; then
            publish=true
            for image in ldk-server ldk-server-mcp; do
              if docker buildx imagetools inspect "$REGISTRY/$image:${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
                echo "$image:${{ steps.version.outputs.version }} is already published; not rebuilding it"
                publish=false
              fi
            done
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    needs: upstream
    # On a release tag whose images already exist there is nothing to build.
    if: needs.upstream.outputs.publish == 'true' || !startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        image: [ldk-server, ldk-server-mcp]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    env:
      PUBLISH: ${{ needs.upstream.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: docker/ldk-server
          target: ${{ matrix.image }}
          platforms: linux/${{ matrix.arch }}
          build-args: LDK_SERVER_REV=${{ needs.upstream.outputs.revision }}
          # source names this repository so the ghcr.io package stays linked to it; version and
          # revision are upstream's, the code the image runs.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.version=${{ needs.upstream.outputs.version }}
            org.opencontainers.image.revision=${{ needs.upstream.outputs.revision }}
            org.opencontainers.image.url=https://github.com/lightningdevkit/ldk-server/tree/${{ needs.upstream.outputs.revision }}
            org.opencontainers.image.description=${{ matrix.image }} ${{ needs.upstream.outputs.version }} (lightningdevkit/ldk-server@${{ needs.upstream.outputs.revision }})
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - if: env.PUBLISH == 'true'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}-${{ matrix.image }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  publish:
    needs: [upstream, build]
    if: needs.upstream.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        image: [ldk-server, ldk-server-mcp]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          # Image last: digest-*-ldk-server must not also match digest-*-ldk-server-mcp.
          pattern: digest-*-${{ matrix.image }}
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
          VERSION: ${{ needs.upstream.outputs.version }}
          RELEASE: ${{ needs.upstream.outputs.release }}
        run: |
          # The upstream version, always; for an upstream release also its minor line (0.2).
          set -- -t "$IMAGE:$VERSION"
          if [ "$RELEASE" = true ]; then set -- "$@" -t "$IMAGE:${VERSION%.*}"; fi
          for digest in *; do set -- "$@" "$IMAGE@sha256:$digest"; done
          docker buildx imagetools create "$@"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  assistant:
    # goose-gateway with the release's ldk-server-mcp copied in (docker/assistant). No RUN step,
    # so one multi-platform build on one runner needs no emulation. It is this repository's
    # product (a gateway release plus an ldk-server-mcp version), so it carries this
    # repository's version.
    needs: [upstream, publish]
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') && needs.upstream.result == 'success'
      && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/ldk-node-assistant
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: docker/assistant
          platforms: linux/amd64,linux/arm64
          build-args: LDK_SERVER_MCP_IMAGE=${{ env.REGISTRY }}/ldk-server-mcp:${{ needs.upstream.outputs.version }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.licenses=MIT
            io.github.vincenzopalazzo.ldk-server-mcp.version=${{ needs.upstream.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
      - run: docker buildx imagetools inspect ${{ env.REGISTRY }}/ldk-node-assistant:${{ steps.meta.outputs.version }}
