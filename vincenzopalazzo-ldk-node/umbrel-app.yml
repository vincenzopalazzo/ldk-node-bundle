manifestVersion: 1
id: vincenzopalazzo-ldk-node
category: bitcoin
name: LDK Node
version: "0.1.0"
tagline: A Lightning node built on LDK, with a dashboard and an AI assistant
description: >-
  LDK Node runs ldk-server, a Lightning node built on the Lightning Development Kit, connected
  to the Bitcoin node on your Umbrel, with a web dashboard for payments, channels and liquidity.


  The built-in assistant answers questions about your node and can prepare payments and channel
  opens for your approval. It runs through goose and can use a subscription you already have
  (xAI SuperGrok, ChatGPT, GitHub Copilot) or an API key; set it up from the assistant's
  provider panel.


  IMPORTANT: the node creates its seed on first start. Umbrel backups include the seed but not
  the channel database, because restoring old channel state can lose funds. Before relying on
  this node for significant amounts, keep your own current backup of the channel state.
